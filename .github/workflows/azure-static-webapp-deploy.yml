name: Deploy Azure static website
on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Show Azure account
        run: az account show
      - name: Check storage account
        run: |
          az storage account show \
            --name stazureportfoliob001 \
            --resource-group rg-azure-portfolio-dev
      - name: Upload website files to Azure Storage
        run:  |
          az storage blob upload-batch \
            --account-name stazureportfoliob001 \
            --auth-mode login \
            --source ./website \
            --destination '$web' \
            --overwrite